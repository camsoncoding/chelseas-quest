<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Chelsea's Quest - Chapter 1: The Match</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:radial-gradient(ellipse at center,#1A1030,#060610);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;gap:12px}
.gb{width:404px;background:#EDE0D0;border-radius:14px 14px 20px 72px;border:2px solid #C8A878;padding:16px 14px 32px;position:relative;box-shadow:8px 14px 48px rgba(0,0,0,.85),inset 0 2px 0 rgba(255,255,255,.35)}
.led-row{display:flex;align-items:center;gap:5px;margin-bottom:8px}
.led{width:9px;height:9px;border-radius:50%;background:#00FF66;box-shadow:0 0 8px #00EE55;animation:glow 2.5s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.55}}
.led-lbl{font-size:5.5px;color:#8A6845;letter-spacing:.14em;font-family:'Courier New',monospace}
.brand{text-align:center;margin-bottom:10px}
.b1{font-size:11.5px;letter-spacing:.5em;color:#5A3820;font-family:'Courier New',monospace;font-weight:bold}
.b2{font-size:6px;letter-spacing:.3em;color:#9A7055;font-family:'Courier New',monospace}
.housing{background:#8A7858;border-radius:11px 11px 5px 5px;padding:14px 13px 18px;border:1.5px solid #6A5838;margin-bottom:14px;position:relative}
.housing::before{content:'';position:absolute;top:7px;left:16px;right:16px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);border-radius:1px}
.bezel{background:#0E0E1A;border-radius:4px;padding:6px}
canvas#c{display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:2px;cursor:pointer;width:344px;height:304px}
.ctrls{display:flex;justify-content:space-between;align-items:flex-start;padding:0 5px}
.dpad{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;width:84px;height:84px;position:relative;flex-shrink:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.dpH,.dpV{position:absolute;background:#252525;border-radius:3px;cursor:pointer;-webkit-user-select:none;user-select:none;}
.dpH{width:100%;height:33%;top:33.5%}
.dpV{width:33%;height:100%;left:33.5%}
.dpC{position:absolute;width:36%;height:36%;top:32%;left:32%;background:#161616;border-radius:50%;z-index:2}
.dpH:active,.dpV:active{background:#0E0E0E}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;padding-bottom:5px}
.sys{display:flex;gap:12px}
.sb{background:#887860;border:none;border-radius:8px;padding:4px 10px;font-size:6px;font-family:'Courier New',monospace;color:#EDE0D0;letter-spacing:.1em;cursor:pointer;text-transform:uppercase;box-shadow:0 2px 0 #5A4830}
.sb:active{box-shadow:none;transform:translateY(2px)}
.ab{display:flex;gap:12px;align-items:center;flex-shrink:0;padding-top:22px}
.bB,.bA{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;font-family:'Courier New',monospace;font-weight:bold}
.bB{background:#6828A8;box-shadow:0 5px 0 #3A1860;color:#DDB8FF}
.bA{background:#C82050;box-shadow:0 5px 0 #781030;color:#FFB8C8;margin-top:22px}
.bB:active,.bA:active{box-shadow:none;transform:translateY(5px)}
.spk{position:absolute;right:18px;bottom:82px;display:grid;grid-template-columns:repeat(4,6px);grid-template-rows:repeat(3,6px);gap:3px;transform:rotate(15deg)}
.sd{width:5px;height:5px;border-radius:50%;background:#C0A070}
.slot{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);width:80px;height:7px;background:#B09060;border-radius:3px}
.hint{font-size:9px;color:#6A608A;font-family:'Courier New',monospace;text-align:center;letter-spacing:.04em;line-height:1.8}
</style>
</head>
<body>
<div class="gb">
  <div class="led-row"><div class="led"></div><span class="led-lbl">BATTERY</span></div>
  <div class="brand"><div class="b1">GAME BOY</div><div class="b2">COLOR</div></div>
  <div class="housing"><div class="bezel"><canvas id="c" width="344" height="304"></canvas></div></div>
  <div class="ctrls">
    <div class="dpad" id="dp"><div class="dpH"></div><div class="dpV"></div><div class="dpC"></div></div>
    <div class="mid"><div class="sys"><button class="sb">SEL</button><button class="sb" id="stB">START</button></div></div>
    <div class="ab"><button class="bB" id="bBtn">B</button><button class="bA" id="aBtn">A</button></div>
  </div>
  <div class="spk" id="spk"></div>
  <div class="slot"></div>
</div>
<p class="hint">Arrows to move | A to interact | B back</p>

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowUp'   ||e.key==='w')K.u=1;
  if(e.key==='ArrowDown' ||e.key==='s')K.d=1;
  if(e.key==='ArrowLeft' ||e.key==='a')K.l=1;

});
var dpEl=document.getElementById('dp');
function handleDpad(cx2,cy2){
  var r=dpEl.getBoundingClientRect();
  var dx=cx2-(r.left+r.width*0.5),dy=cy2-(r.top+r.height*0.5);
  K.u=K.d=K.l=K.r=0;
  if(Math.abs(dy)>Math.abs(dx)){if(dy<0)K.u=1;else K.d=1;}
  else{if(dx<0)K.l=1;else K.r=1;}
}
dpEl.addEventListener('pointerdown',function(e){handleDpad(e.clientX,e.clientY);e.preventDefault();},{passive:false});
dpEl.addEventListener('pointermove', function(e){if(e.buttons>0)handleDpad(e.clientX,e.clientY);e.preventDefault();},{passive:false});
dpEl.addEventListener('pointerup',   function(){K.u=K.d=K.l=K.r=0;});
dpEl.addEventListener('pointercancel',function(){K.u=K.d=K.l=K.r=0;});

// ── PLAYER MOVEMENT ──
function updatePlayer(){
  if(DLG.on||DLG.fadeOut>0||(scene==='karaoke'&&karaokeSubScene!='bar_walk'))return;
  if(P.moving){
    var dx=P.tpx-P.px,dy=P.tpy-P.py,d=Math.sqrt(dx*dx+dy*dy);
    if(d<=SPD){P.px=P.tpx;P.py=P.tpy;P.moving=false;}
    else{P.px+=dx/d*SPD;P.py+=dy/d*SPD;}
    P.step++;return;
  }
  if(P.delay>0){P.delay--;return;}
  var nx=P.tx,ny=P.ty,mv=false;
  if(K.u){P.dir=0;ny--;mv=true;}
  else if(K.d){P.dir=2;ny++;mv=true;}
  else if(K.l){P.dir=3;nx--;mv=true;}
  else if(K.r){P.dir=1;nx++;mv=true;}
  if(mv&&!isSolid(nx,ny)&&!npcAt(nx,ny)){
    P.tpx=nx*TS;P.tpy=ny*TS;P.tx=nx;P.ty=ny;P.moving=true;P.delay=3;
  }
}

      }
    }
    return;
  }
  var adj=[[P.tx,P.ty-1],[P.tx,P.ty+1],[P.tx-1,P.ty],[P.tx+1,P.ty]];
  for(var i=0;i<adj.length;i++){
    var ax=adj[i][0],ay=adj[i][1];

    if(npc){
      DLG.on=true;DLG.page=0;DLG.speaker=npc.name;

    }
  }
}

// ---- KARAOKE STATE ----
var K = {
  active:    false,
  phase:     "intro",   // intro > screen > blank > jayz > done
  screenIdx: 0,
  blankIdx:  0,
  optSel:    1,
  feedback:  null,      // null | "correct" | "wrong"
  feedTimer: 0,
  jayzPage:  0,
  onComplete: null,
  score:     0,
  total:     3,
  leftHeld:  false,
  rightHeld: false
};

function startKaraoke(onComplete) {
  K.active    = true;
  K.phase     = "intro";
  K.screenIdx = 0;
  K.blankIdx  = 0;
  K.optSel    = 1;
  K.feedback  = null;
  K.feedTimer = 0;
  K.jayzPage  = 0;
  K.score     = 0;
  K.onComplete = onComplete;
}

function karaokeA() {
  if (!K.active) return;

  if (K.phase === "intro") {
    K.phase = "screen";
    return;
  }

  if (K.phase === "screen") {
    var scr = KSCREENS[K.screenIdx];
    // Find next unanswered blank on this screen
    var blanks = scr.blanks;
    var nextBlank = -1;
    for (var i = 0; i < blanks.length; i++) {
      if (i >= K.blankIdx) { nextBlank = i; break; }
    }
    if (nextBlank >= 0) {
      K.blankIdx = nextBlank;
      K.optSel   = 1;
      K.phase    = "blank";
    } else {
      // Advance to next screen
      K.screenIdx++;
      K.blankIdx = 0;
      if (K.screenIdx >= KSCREENS.length) {
        K.phase   = "jayz";
        K.jayzPage = 0;
      }
    }
    return;
  }

  if (K.phase === "blank") {
    if (K.feedback !== null) return; // waiting for timer
    var scr    = KSCREENS[K.screenIdx];
    var blank  = scr.blanks[K.blankIdx];
    var chosen = blank.opts[K.optSel];
    var correct = (chosen === blank.answer);
    K.feedback  = correct ? "correct" : "wrong";
    K.feedTimer = 0;
    if (correct) K.score++;
    return;
  }

  if (K.phase === "jayz") {
    K.jayzPage++;
    if (K.jayzPage >= KJAYZ.length) {
      K.active = false;
      K.phase  = "done";
      if (K.onComplete) K.onComplete();
    }
    return;
  }
}

function karaokeLeft()  { if (K.phase === "blank" && K.feedback === null) K.optSel = Math.max(0, K.optSel - 1); }
function karaokeRight() { if (K.phase === "blank" && K.feedback === null) { var scr = KSCREENS[K.screenIdx]; var blank = scr.blanks[K.blankIdx]; K.optSel = Math.min(blank.opts.length - 1, K.optSel + 1); } }

function karaokeUpdate() {
  if (!K.active) return;
  if (K.feedback !== null) {
    K.feedTimer++;
    if (K.feedTimer > 60) {
      K.feedback  = null;
      K.feedTimer = 0;
      // advance blank or screen
      K.blankIdx++;
      var scr    = KSCREENS[K.screenIdx];
      var blanks = scr.blanks;
      var nextBlank = -1;
      for (var i = K.blankIdx; i < blanks.length; i++) {
        nextBlank = i; break;
      }
      if (nextBlank >= 0) {
        K.blankIdx = nextBlank;
        K.optSel   = 1;
        K.phase    = "blank";
      } else {
        K.phase    = "screen";
        K.blankIdx = blanks.length; // mark all done
      }
    }
  }
}

  // String lights

  for (var lx = 8; lx < W; lx += 18) {
    var swing = Math.sin(frame * 0.03 + lx * 0.1) * 3;
    cx.fillStyle = lightColors[Math.floor(lx / 18) % lightColors.length];
    cx.beginPath();
    cx.arc(lx, 8 + swing, 4, 0, Math.PI * 2);
    cx.fill();
  }

  // Title bar
  cx.fillStyle = "rgba(0,0,0,0.6)";
  cx.fillRect(0, 16, W, 22);
  cx.fillStyle = "#FF44BB";
  cx.font = "bold 9px 'Press Start 2P',monospace";
  cx.textAlign = "center";
  cx.fillText("CRAZY IN LOVE", W / 2, 31);

  if (K.phase === "intro") {
    cx.fillStyle = "#FFFFFF";
    cx.font = "8px 'Press Start 2P',monospace";
    cx.textAlign = "center";
    cx.fillText("Chelsea grabs the mic...", W / 2, H / 2 - 10);

    cx.fillText("She said she knew", W / 2, H / 2 + 8);
    cx.fillText("the words...", W / 2, H / 2 + 22);
    if (Math.floor(frame / 28) % 2 === 0) {
      cx.fillStyle = "#FFD070";
      cx.fillText("A: LETS GO", W / 2, H - 18);
    }
    return;
  }

  if (K.phase === "screen" || K.phase === "blank") {
    var scr = KSCREENS[K.screenIdx];
    var lines = scr.lines;
    var blanks = scr.blanks;

    // Lyric box
    cx.fillStyle = "rgba(0,0,0,0.75)";
    cx.fillRect(6, 42, W - 12, H - 80);
    cx.strokeStyle = "#AA44FF";
    cx.lineWidth = 1;
    cx.strokeRect(6, 42, W - 12, H - 80);

    // Draw each line
    var startY = 57;
    var lineH   = 13;
    for (var li = 0; li < lines.length; li++) {
      var line = lines[li];
      var isBlankLine = false;

      for (var bi = 0; bi < blanks.length; bi++) {
        if (blanks[bi].lineIdx === li) {
          isBlankLine = true;
          blankObj    = blanks[bi];
          break;
        }
      }

      if (isBlankLine && blankObj !== null) {
        // Check if this blank has been answered
        var answered = (K.blankIdx > blankObj.lineIdx || (K.phase === "screen" && K.blankIdx >= blanks.length));
        if (answered) {
          // Show filled answer
          var filled = line.replace("[???]", blankObj.answer);
          cx.fillStyle = "#44FF88";
          cx.font = "7px 'Press Start 2P',monospace";
          cx.textAlign = "center";
          cx.fillText(filled, W / 2, startY + li * lineH);
        } else {
          // Highlight the blank line
          cx.fillStyle = K.phase === "blank" && K.blankIdx === blanks.indexOf(blankObj) ? "#FFD070" : "#AAAAFF";
          cx.font = "7px 'Press Start 2P',monospace";
          cx.textAlign = "center";
          cx.fillText(line, W / 2, startY + li * lineH);

        cx.fillStyle = "#DDDDFF";
        cx.font = "7px 'Press Start 2P',monospace";

    // Bottom area
    if (K.phase === "blank") {

          if (sel) {

          }

          cx.textAlign = "center";
          cx.fillText(opts[oi], oi * bw + bw / 2, H - 16);

        if (K.feedback !== null) {

  if (K.phase === "jayz") {

    var spotColors = ["rgba(255,80,80,0.15)","rgba(80,80,255,0.15)","rgba(80,255,150,0.15)"];

    // Josh sprite on stage left
    if (joshImg && joshImg.complete && joshImg.naturalWidth > 0) {
      cx.drawImage(joshImg, 18, H - 90, 40, 56);
    } else {
      cx.fillStyle = "#2858B8";
      cx.fillRect(18, H - 70, 28, 40);
      cx.fillStyle = "#FDBF8A";
      cx.fillRect(22, H - 82, 20, 20);
    }

    // Crown above Josh
    cx.fillStyle = "#FFD700";
    cx.fillRect(24, H - 98, 16, 4);
    cx.fillRect(24, H - 102, 2, 4);
    cx.fillRect(30, H - 104, 4, 8);
    cx.fillRect(38, H - 102, 2, 4);

    // JAY-Z label
    cx.fillStyle = "#FFD070";
    cx.font = "8px 'Press Start 2P',monospace";
    cx.textAlign = "left";
    cx.fillText("JAY-Z:", 14, H - 106);

    // Speech bubble
    var bx = 64, by = 40, bw2 = W - 74, bh2 = H - 100;
    cx.fillStyle = "rgba(255,255,255,0.95)";
    cx.fillRect(bx, by, bw2, bh2);
    cx.strokeStyle = "#AA44FF";
    cx.lineWidth = 2;
    cx.strokeRect(bx, by, bw2, bh2);
    // Bubble tail
    cx.fillStyle = "rgba(255,255,255,0.95)";
    cx.beginPath();
    cx.moveTo(bx, by + 20);
    cx.lineTo(bx - 12, by + 30);
    cx.lineTo(bx, by + 40);
    cx.closePath();
    cx.fill();

    // Lyrics in bubble
    var page = KJAYZ[K.jayzPage];
    cx.fillStyle = "#111111";
    cx.font = "7px 'Press Start 2P',monospace";
    cx.textAlign = "left";
    for (var pi = 0; pi < page.length; pi++) {
      cx.fillText(page[pi], bx + 6, by + 18 + pi * 13);
    }

    // Page indicator + prompt
    cx.fillStyle = "#AA44FF";
    cx.font = "6px 'Press Start 2P',monospace";
    cx.textAlign = "right";
    cx.fillText((K.jayzPage + 1) + "/" + KJAYZ.length, bx + bw2 - 4, by + bh2 - 4);

    if (Math.floor(frame / 28) % 2 === 0) {
      cx.fillStyle = "#111111";
      cx.font = "6px 'Press Start 2P',monospace";
      cx.textAlign = "center";
      cx.fillText("A: NEXT", bx + bw2 / 2, by + bh2 - 4);
    }

    // Score at top
    cx.fillStyle = "#FFD070";
    cx.font = "6px 'Press Start 2P',monospace";
    cx.textAlign = "center";
    cx.fillText("YOU GOT " + K.score + "/" + K.total + " CORRECT", W / 2, 28);
    return;
  }
}


function drawKaraokeBar(){
  // Walkable karaoke bar — same structure as coffee shop
  if(imgs.bgKaraoke.complete) cx.drawImage(imgs.bgKaraoke,0,HUD,W,H-HUD);
  else R(0,HUD,W,H-HUD,'#0D0818');

  // Draw mic stand on stage as interactable object
  var mx=MIC.tx*TS+4, my=HUD+MIC.ty*TS+4;
  cx.fillStyle='#CCCCCC';
  cx.fillRect(mx+6,my,3,14); // stand
  cx.fillRect(mx+2,my+14,11,3); // base
  cx.beginPath();cx.arc(mx+7,my-2,6,0,Math.PI*2);cx.fillStyle='#888888';cx.fill();
  cx.beginPath();cx.arc(mx+7,my-2,4,0,Math.PI*2);cx.fillStyle='#555555';cx.fill();

  // Sort sprites by Y
  var ents=[];
  ents.push({sy:P.ty,draw:drawPlayer});
  currentNPCS.forEach(function(npc){
    ents.push({sy:npc.ty,draw:function(n){return function(){drawNPC(n);};}(npc)});
  });
  ents.sort(function(a,b){return a.sy-b.sy;});
  ents.forEach(function(e){e.draw();});

  drawHUD('CAPPYS CAFE');

  // Check if near mic for prompt
  var adj=[[P.tx,P.ty-1],[P.tx,P.ty+1],[P.tx-1,P.ty],[P.tx+1,P.ty]];
  var nearMic=false;
  for(var i=0;i<adj.length;i++){
    if(adj[i][0]===MIC.tx&&adj[i][1]===MIC.ty){nearMic=true;break;}
  }
  if(nearMic) drawBottomHint('A: GRAB THE MIC!');
}

function drawJayzBar(){
  // Jay-Z cutscene: bar background, Josh on stage, speech bubble
  if(imgs.bgKaraoke.complete) cx.drawImage(imgs.bgKaraoke,0,HUD,W,H-HUD);
  else R(0,HUD,W,H-HUD,'#0D0818');

  // Josh on stage — position near mic
  var jx = MIC.tx*TS - 6;
  var jy = HUD + MIC.ty*TS - (40-TS) + 2;
  drawImg(imgs.joshDown, jx, jy, 29, 40);

  // Speech bubble above Josh
  var page = KJAYZ[K.jayzPage] || [];
  cx.font = "6px 'Press Start 2P',monospace";
  var maxW = 0;
  for(var i=0;i<page.length;i++){
    var tw=cx.measureText(page[i]).width;
    if(tw>maxW)maxW=tw;
  }
  var bw=maxW+18, bh=page.length*12+14;
  var bx=jx+14-bw/2, by=jy-bh-14;
  if(bx<4)bx=4;
  if(bx+bw>W-4)bx=W-4-bw;
  if(by<HUD+4)by=HUD+4;

  // Bubble
  cx.fillStyle='rgba(255,255,255,0.96)';
  cx.fillRect(bx,by,bw,bh);
  cx.strokeStyle='#AA44FF';cx.lineWidth=1.5;
  cx.strokeRect(bx,by,bw,bh);
  // Tail
  var tx2=jx+14;
  cx.fillStyle='rgba(255,255,255,0.96)';
  cx.beginPath();cx.moveTo(tx2-5,by+bh);cx.lineTo(tx2,jy-2);cx.lineTo(tx2+5,by+bh);cx.closePath();cx.fill();

  // Lyrics
  cx.fillStyle='#111';
  cx.font="6px 'Press Start 2P',monospace";
  cx.textAlign='left';
  for(var i=0;i<page.length;i++){
    cx.fillText(page[i], bx+9, by+13+i*12);
  }

  // HUD
  drawHUD('CAPPYS CAFE');
  R(0,H-18,W,18,'rgba(10,8,24,0.85)');
  R(0,H-19,W,1,'#4A3898');
  cx.fillStyle='#FFD070';cx.font="6px 'Press Start 2P',monospace";cx.textAlign='center';
  cx.fillText('Score:'+K.score+'/'+K.total+'  ('+( K.jayzPage+1)+'/'+KJAYZ.length+')',W/2-20,H-5);
  if(Math.floor(frame/28)%2===0){cx.fillStyle='#FFFFFF';cx.fillText('A',W-14,H-5);}
}

function drawKaraokeScene(){
  if(K.phase==='jayz') drawJayzBar();
  else drawKaraoke(cx,W,H,frame,imgs.joshDown);
}

// ── CHAPTER DONE ──
function drawChapterDone(){
  R(0,0,W,H,'#080818');
  // Sparkle animation
  var sparks=[[22,18],[48,12],[80,22],[112,16],[136,28],[35,38],[95,30],[60,8],[18,50],[108,44],[72,54],[42,58]];
  sparks.forEach(function(s,i){
    var t=(frame+i*8)%50;
    if(t<25){var c=['#FF4444','#FFAA00','#44FFAA','#FF88CC','#FFD700'][i%5];D(s[0],s[1],c);if(t<12){D(s[0]-1,s[1],c);D(s[0]+1,s[1],c);D(s[0],s[1]-1,c);D(s[0],s[1]+1,c);}}
  });
  T('CHAPTER 1',W/2,H/2-30,'#FFD070',8);
  T('COMPLETE!',W/2,H/2-12,'#FFD070',8);
  // Heart
  var hx=W/2|0,hy=H/2+10;
  cx.fillStyle='#FF5599';cx.fillRect(hx-3,hy,2,2);cx.fillRect(hx+1,hy,2,2);cx.fillRect(hx-3,hy+2,7,2);cx.fillStyle='#CC1144';cx.fillRect(hx-3,hy+4,7,2);cx.fillRect(hx-2,hy+6,5,1);cx.fillRect(hx-1,hy+7,3,1);D(hx,hy+8,'#AA0033');
  T('Score: '+K.score+'/'+K.total+' on lyrics!',W/2,H/2+34,'#AAAAFF',6);
  if(Math.floor(frame/30)%2===0) T('A: CONTINUE',W/2,H/2+54,'#88FF88',6);
}

// ── MAIN LOOP ──
// Karaoke sub-scene: 'bar_walk' = walking around bar, 'kar_game' = playing game
var karaokeSubScene = 'bar_walk';

// Mic location on stage — adjacent to walkable tiles so Chelsea can interact
var MIC = {tx:10, ty:5}; // on stage, Chelsea approaches from ty:6

function loop(){
  frame++;
  if(fadeIn>0) fadeIn--;

  // Left/right held for karaoke word selection
  if(K.l && !lH){ karaokeLeft();  lH=true; } if(!K.l) lH=false;
  if(K.r && !rH){ karaokeRight(); rH=true; } if(!K.r) rH=false;

  if(aF){
    if(scene==='title')        { initScene('coffee'); }
    else if(scene==='coffee')  { doInteract(); }
    else if(scene==='karaoke'){
      if(karaokeSubScene==='bar_walk'){
        // Check if adjacent to mic
        var adj=[[P.tx,P.ty-1],[P.tx,P.ty+1],[P.tx-1,P.ty],[P.tx+1,P.ty]];
        var nearMic=false;
        for(var i=0;i<adj.length;i++){
          if(adj[i][0]===MIC.tx&&adj[i][1]===MIC.ty){nearMic=true;break;}
        }
        if(nearMic){
          karaokeSubScene='kar_game';
          K.phase='intro';
        } else {
          doInteract();
        }
      } else {
        karaokeA();
        if(!K.active&&scene!=='chapter_done') scene='chapter_done';
      }
    }
    else if(scene==='chapter_done'){ window.location.href='interlude.html'; }
    aF=false;
  }
  if(bF) bF=false;

  if(scene==='coffee') updatePlayer();
  if(scene==='karaoke'&&karaokeSubScene==='bar_walk') updatePlayer();
  if(scene==='karaoke'&&karaokeSubScene==='kar_game') karaokeUpdate();

  cx.clearRect(0,0,W,H);
  if(scene==='title')               drawTitle();
  else if(scene==='coffee')         drawCoffeeShop();
  else if(scene==='bar_transition') drawBarTransition();
  else if(scene==='karaoke'){
    if(karaokeSubScene==='bar_walk') drawKaraokeBar();
    else                             drawKaraokeScene();
  }
  else if(scene==='chapter_done')   drawChapterDone();

  if(fadeIn>0){cx.fillStyle='rgba(0,0,0,'+(fadeIn/30)+')';cx.fillRect(0,0,W,H);}
  requestAnimationFrame(loop);
}

// Audio
var audio=null;
function initAudio(){
  if(audio)return;
  try{audio=new Audio('assets/music/Karaoke_Song.mp3');audio.loop=true;audio.volume=0.7;audio.play();}catch(e){audio=null;}
}

loop();
</script>
