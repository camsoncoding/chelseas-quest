<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Chelsea's Quest - The Wedding</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;gap:12px}
.gb{width:404px;background:#EDE0D0;border-radius:14px 14px 20px 72px;border:2px solid #C8A878;padding:16px 14px 32px;position:relative;box-shadow:8px 14px 48px rgba(0,0,0,.85)}
.led-row{display:flex;align-items:center;gap:5px;margin-bottom:8px}
.led{width:9px;height:9px;border-radius:50%;background:#00FF66;box-shadow:0 0 8px #00EE55;animation:glow 2.5s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.55}}
.led-lbl{font-size:5.5px;color:#8A6845;letter-spacing:.14em;font-family:'Courier New',monospace}
.brand{text-align:center;margin-bottom:10px}
.b1{font-size:11.5px;letter-spacing:.5em;color:#5A3820;font-family:'Courier New',monospace;font-weight:bold}
.b2{font-size:6px;letter-spacing:.3em;color:#9A7055;font-family:'Courier New',monospace}
.housing{background:#8A7858;border-radius:11px 11px 5px 5px;padding:14px 13px 18px;border:1.5px solid #6A5838;margin-bottom:14px}
.bezel{background:#0E0E1A;border-radius:4px;padding:6px}
canvas#c{display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border-radius:2px;cursor:pointer;width:344px;height:304px}
.ctrls{display:flex;justify-content:space-between;align-items:flex-start;padding:0 5px}
.dpad{width:84px;height:84px;position:relative;flex-shrink:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.dpH,.dpV{position:absolute;background:#252525;border-radius:3px;cursor:pointer;-webkit-user-select:none;user-select:none;}
.dpH{width:100%;height:33%;top:33.5%}
.dpV{width:33%;height:100%;left:33.5%}
.dpC{position:absolute;width:36%;height:36%;top:32%;left:32%;background:#161616;border-radius:50%;z-index:2}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;padding-bottom:5px}
.sys{display:flex;gap:12px}
.sb{background:#887860;border:none;border-radius:8px;padding:4px 10px;font-size:6px;font-family:'Courier New',monospace;color:#EDE0D0;cursor:pointer;text-transform:uppercase;box-shadow:0 2px 0 #5A4830}
.ab{display:flex;gap:12px;align-items:center;flex-shrink:0;padding-top:22px}
.bB,.bA{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;font-size:14px;font-family:'Courier New',monospace;font-weight:bold}
.bB{background:#6828A8;box-shadow:0 5px 0 #3A1860;color:#DDB8FF}
.bA{background:#C82050;box-shadow:0 5px 0 #781030;color:#FFB8C8;margin-top:22px}
.bB:active,.bA:active{box-shadow:none;transform:translateY(5px)}
.spk{position:absolute;right:18px;bottom:82px;display:grid;grid-template-columns:repeat(4,6px);grid-template-rows:repeat(3,6px);gap:3px;transform:rotate(15deg)}
.sd{width:5px;height:5px;border-radius:50%;background:#C0A070}
.slot{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);width:80px;height:7px;background:#B09060;border-radius:3px}
.hint{font-size:9px;color:#6A608A;font-family:'Courier New',monospace;text-align:center}
</style>
</head>
<body>
<div class="gb">
  <div class="led-row"><div class="led"></div><span class="led-lbl">BATTERY</span></div>
  <div class="brand"><div class="b1">GAME BOY</div><div class="b2">COLOR</div></div>
  <div class="housing"><div class="bezel"><canvas id="c" width="344" height="304"></canvas></div></div>
  <div class="ctrls">
    <div class="dpad" id="dp"><div class="dpH"></div><div class="dpV"></div><div class="dpC"></div></div>
    <div class="mid"><div class="sys"><button class="sb">SEL</button><button class="sb">START</button></div></div>
    <div class="ab"><button class="bB">B</button><button class="bA" id="aBtn">A</button></div>
  </div>
  <div class="spk" id="spk"></div>
  <div class="slot"></div>
</div>

<script>
var spkEl=document.getElementById('spk');
for(var i=0;i<12;i++){var d=document.createElement('div');d.className='sd';spkEl.appendChild(d);}
var cv=document.getElementById('c'),cx=cv.getContext('2d');
var W=344,H=304;
var PHOTOS=['wp0','wp1','wp2','wp3','wp4'];
var imgs=[];
for(var i=0;i<PHOTOS.length;i++) imgs.push(document.getElementById(PHOTOS[i]));

var current=0, phase='title', frame=0, fadeAlpha=1.0, fadingIn=true, aF=false;

var audio=null;
function initAudio(){
  if(audio)return;
  try{audio=new Audio('assets/music/wedding.mp3');audio.loop=true;audio.volume=0.7;audio.play();}
  catch(e){audio=null;}
}

document.addEventListener('keydown',function(e){
  if(['z','Z','Enter',' '].indexOf(e.key)>=0){aF=true;e.preventDefault();}
});
document.getElementById('aBtn').onclick=function(){aF=true;initAudio();};
cv.onclick=function(){aF=true;initAudio();};

function advance(){fadingIn=false;fadeAlpha=0;}

function drawTitle(){
  cx.fillStyle='#0A0818';cx.fillRect(0,0,W,H);
  // Sparkle effect
  for(var i=0;i<20;i++){
    var t=(frame*0.5+i*17)%100;
    if(t<50){
      cx.fillStyle='rgba(255,215,100,'+(1-t/50)+')';
      cx.fillRect(((i*73)%W)|0,((i*41+frame)%200+50)|0,2,2);
    }
  }
  cx.fillStyle='#FFD070';cx.font="9px 'Press Start 2P',monospace";cx.textAlign='center';
  cx.fillText('BELHURST',W/2,H/2-44);
  cx.fillText('CASTLE',W/2,H/2-26);
  cx.fillStyle='#FF88CC';cx.font="6px 'Press Start 2P',monospace";
  cx.fillText('Finger Lakes, NY',W/2,H/2-6);
  cx.fillStyle='#FFFFFF';cx.font="5px 'Press Start 2P',monospace";
  cx.fillText('April 19, 2015',W/2,H/2+10);
  if(Math.floor(frame/30)%2===0){
    cx.fillStyle='#FFD070';cx.font="7px 'Press Start 2P',monospace";
    cx.fillText('A: CONTINUE',W/2,H/2+38);
  }
}

function drawPhoto(){
  cx.fillStyle='#000';cx.fillRect(0,0,W,H);
  var img=imgs[current];
  if(img&&img.complete) cx.drawImage(img,0,17,W,270);
  // Top bar
  cx.fillStyle='rgba(0,0,0,0.85)';cx.fillRect(0,0,W,16);
  cx.fillStyle='#FFD070';cx.font="6px 'Press Start 2P',monospace";cx.textAlign='center';
  cx.fillText('THE WEDDING',W/2,11);
  // Bottom bar
  cx.fillStyle='rgba(0,0,0,0.85)';cx.fillRect(0,287,W,17);
  // Page dots
  for(var i=0;i<imgs.length;i++){
    cx.fillStyle=i===current?'#FFD070':'#444';
    cx.beginPath();cx.arc(W/2+(i-(imgs.length-1)/2)*12,295,3,0,Math.PI*2);cx.fill();
  }
  if(Math.floor(frame/25)%2===0){
    cx.fillStyle='#FFFFFF';cx.font="5px 'Press Start 2P',monospace";cx.textAlign='right';
    cx.fillText(current<imgs.length-1?'A: NEXT':'A: CONTINUE',W-6,298);
  }
  if(fadeAlpha>0){cx.fillStyle='rgba(0,0,0,'+fadeAlpha+')';cx.fillRect(0,0,W,H);}
}

function drawDone(){
  cx.fillStyle='#0A0818';cx.fillRect(0,0,W,H);
  for(var i=0;i<15;i++){
    var t=(frame*0.4+i*23)%80;
    if(t<40){cx.fillStyle='rgba(255,215,100,'+(1-t/40)+')';cx.fillRect(((i*89+frame)%W)|0,((i*53)%240)|0,2,2);}
  }
  cx.fillStyle='#FF88CC';cx.font="7px 'Press Start 2P',monospace";cx.textAlign='center';
  cx.fillText('CHAPTER 2',W/2,H/2-24);
  cx.fillStyle='#FFD070';cx.font="8px 'Press Start 2P',monospace";
  cx.fillText('COMPLETE!',W/2,H/2-6);
  cx.fillStyle='#FFFFFF';cx.font="5px 'Press Start 2P',monospace";
  cx.fillText('Mr. & Mrs. Camson',W/2,H/2+14);
  if(Math.floor(frame/30)%2===0){
    cx.fillStyle='#88FF88';cx.font="7px 'Press Start 2P',monospace";
    cx.fillText('A: CHAPTER 3',W/2,H/2+38);
  }
}

function loop(){
  frame++;
  if(fadingIn&&fadeAlpha>0) fadeAlpha=Math.max(0,fadeAlpha-0.04);
  else if(!fadingIn&&fadeAlpha<1) fadeAlpha=Math.min(1,fadeAlpha+0.05);
  else if(!fadingIn&&fadeAlpha>=1){
    if(phase==='title'){phase='photo';fadingIn=true;}
    else if(phase==='photo'&&current<imgs.length-1){current++;fadingIn=true;}
    else if(phase==='photo'){phase='done';fadingIn=true;}
  }
  if(aF){
    initAudio();
    if(phase==='title') advance();
    else if(phase==='photo'&&fadeAlpha===0){
      if(current<imgs.length-1) advance();
      else{phase='done';fadeAlpha=0;fadingIn=true;}
    }
    else if(phase==='done'){
      if(audio){audio.pause();audio.currentTime=0;}
      window.location.href='chapter3.html';
    }
    aF=false;
  }
  cx.clearRect(0,0,W,H);
  if(phase==='title') drawTitle();
  else if(phase==='photo') drawPhoto();
  else if(phase==='done') drawDone();
  requestAnimationFrame(loop);
}

// Wait for images
var _imgs=document.querySelectorAll('img');
var _n=_imgs.length,_d=0;
function _start(){if(++_d>=_n)loop();}
if(_n===0){loop();}
else{for(var _j=0;_j<_imgs.length;_j++){var _im=_imgs[_j];if(_im.complete)_start();else{_im.onload=_start;_im.onerror=_start;}}}
</script>
